<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - FinGuard AI</title>
  <link rel="stylesheet" href="css/claymorphism.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container">
    <header class="navbar">
      <div class="nav-brand">🛡️ FinGuard AI</div>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="dashboard.html" class="active">Dashboard</a></li>
          <li><a href="finance.html">Finance</a></li>
          <li><a href="contracts.html">Contracts</a></li>
          <li><a href="advisor.html">AI Advisor</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="metric-grid">
        <div class="metric-card">
          <div class="label">Monthly Salary</div>
          <div class="value" id="metric-salary">—</div>
        </div>
        <div class="metric-card">
          <div class="label">Total Expenses</div>
          <div class="value" id="metric-expenses">—</div>
        </div>
        <div class="metric-card">
          <div class="label">Net Savings</div>
          <div class="value" id="metric-savings">—</div>
        </div>
      </section>

      <section class="clay-card">
        <h2>Recent Activity</h2>
        <div id="recent-expenses">Loading...</div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>

</html>
